<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Talha Caglar Banner</title>
  <desc id="desc">Colorful cartoon landscape banner - cybersecurity, Linux, automation and developer tooling.</desc>
  <defs>
    <linearGradient id="sky" x1="640" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FC7EA"/>
      <stop offset="0.55" stop-color="#A5E3F2"/>
      <stop offset="0.8" stop-color="#FFE3EE"/>
      <stop offset="1" stop-color="#FFF3C9"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="220" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8F0C9"/>
      <stop offset="1" stop-color="#8FDFAB"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="280" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ED98F"/>
      <stop offset="1" stop-color="#55C070"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#FFE066" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>

    <circle cx="1080" cy="110" r="170" fill="url(#sunGlow)">
      <animate attributeName="r" values="170;185;170" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(1080 110)">
      <g stroke="#FFD43B" stroke-width="10" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <line x1="0" y1="-78" x2="0" y2="-100"/>
        <line x1="55" y1="-55" x2="71" y2="-71"/>
        <line x1="78" y1="0" x2="100" y2="0"/>
        <line x1="55" y1="55" x2="71" y2="71"/>
        <line x1="0" y1="78" x2="0" y2="100"/>
        <line x1="-55" y1="55" x2="-71" y2="71"/>
        <line x1="-78" y1="0" x2="-100" y2="0"/>
        <line x1="-55" y1="-55" x2="-71" y2="-71"/>
      </g>
      <circle r="62" fill="#FFD43B" stroke="#F5B60D" stroke-width="6"/>
      <circle cx="-18" cy="-8" r="6" fill="#3B2B1B"/>
      <circle cx="18" cy="-8" r="6" fill="#3B2B1B"/>
      <path d="M-16 16 Q0 30 16 16" stroke="#3B2B1B" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="-34" cy="8" r="8" fill="#FF9F68" opacity="0.7"/>
      <circle cx="34" cy="8" r="8" fill="#FF9F68" opacity="0.7"/>
    </g>

    <g fill="#FFFFFF">
      <path d="M150 60 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z">
        <animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M420 40 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M700 70 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.9">
        <animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M880 30 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/>
      </path>
      <path d="M60 170 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.8">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#FFFFFF" opacity="0.95">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="18s" repeatCount="indefinite"/>
        <ellipse cx="250" cy="120" rx="70" ry="30"/>
        <ellipse cx="200" cy="135" rx="45" ry="22"/>
        <ellipse cx="305" cy="135" rx="45" ry="22"/>
      </g>
      <g opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="24s" repeatCount="indefinite"/>
        <ellipse cx="640" cy="90" rx="60" ry="26"/>
        <ellipse cx="595" cy="103" rx="38" ry="18"/>
        <ellipse cx="688" cy="103" rx="38" ry="18"/>
      </g>
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 6; 0 0" dur="14s" repeatCount="indefinite"/>
        <ellipse cx="920" cy="200" rx="50" ry="22"/>
        <ellipse cx="884" cy="212" rx="32" ry="15"/>
        <ellipse cx="958" cy="212" rx="32" ry="15"/>
      </g>
    </g>

    <path d="M0 300 Q160 210 340 285 Q470 335 640 290 Q820 240 990 295 Q1130 338 1280 285 L1280 400 L0 400 Z" fill="url(#hillFar)"/>
    <path d="M0 360 Q200 290 430 350 Q640 400 860 345 Q1080 295 1280 355 L1280 400 L0 400 Z" fill="url(#hillNear)"/>

    <g>
      <rect x="1116" y="300" width="12" height="42" rx="6" fill="#8A5A38"/>
      <circle cx="1122" cy="284" r="34" fill="#FF8FB6" stroke="#E96D9C" stroke-width="5"/>
      <circle cx="1104" cy="272" r="6" fill="#FFD6E5"/>
      <rect x="1196" y="316" width="10" height="34" rx="5" fill="#8A5A38"/>
      <circle cx="1201" cy="300" r="26" fill="#B694F2" stroke="#9A72E0" stroke-width="5"/>
    </g>
    <g>
      <rect x="86" y="308" width="12" height="44" rx="6" fill="#8A5A38"/>
      <circle cx="92" cy="290" r="32" fill="#6FE3C6" stroke="#3FC9A6" stroke-width="5"/>
      <circle cx="78" cy="280" r="6" fill="#C9F7EB"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M985 352 q-20 -6 -20 -22 q0 -18 22 -18 l52 0 q14 0 14 -12 q0 -12 -14 -12 l-40 0"
            stroke="#5AC65E" stroke-width="18" stroke-linecap="round" fill="none"/>
      <circle cx="996" cy="288" r="17" fill="#5AC65E"/>
      <circle cx="990" cy="284" r="3.6" fill="#123B14"/>
      <circle cx="1002" cy="284" r="3.6" fill="#123B14"/>
      <path d="M991 294 q5 4 10 0" stroke="#123B14" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M979 288 l-10 -3 m10 9 l-10 3" stroke="#E85D75" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3.6s" repeatCount="indefinite"/>
      <rect x="196" y="330" width="88" height="54" rx="8" fill="#4A4E69" stroke="#33364F" stroke-width="5"/>
      <rect x="204" y="338" width="72" height="38" rx="4" fill="#0F2E24"/>
      <text x="211" y="353" fill="#5AF78E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">$ sudo</text>
      <text x="211" y="368" fill="#5AF78E" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">hack :)</text>
      <path d="M240 320 c-6 -8 -18 -4 -18 5 c0 8 10 12 18 18 c8 -6 18 -10 18 -18 c0 -9 -12 -13 -18 -5 z" fill="#FF6B8A" stroke="#E14D6E" stroke-width="3">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', ui-rounded, sans-serif" text-anchor="middle">
      <text x="640" y="205" font-size="76" font-weight="800"
            fill="#FFFFFF" stroke="#2E5AAC" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Talha Çağlar</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="4s" repeatCount="indefinite"/>
        <rect x="415" y="228" width="450" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.92" stroke="#2E5AAC" stroke-width="4"/>
        <text x="640" y="259" font-size="22" font-weight="700" fill="#2E5AAC">Cybersecurity • Linux • Automation</text>
      </g>
    </g>
  </g>
</svg>
