<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub record">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mixClip"><rect x="60" y="146" width="780" height="9" rx="4"/></clipPath>
    <style>
      /* Additive only: the bar and the numbers are always fully painted, and the
         animation just runs a highlight across them. Nothing depends on the clock. */
      .sheen { transform-box: view-box; opacity: 0; animation: sheen 9s ease-in-out 1.5s infinite; }
      @keyframes sheen {
        0%        { transform: translateX(-200px); opacity: 0; }
        6%        { opacity: 1; }
        40%       { transform: translateX(800px); opacity: 1; }
        46%, 100% { transform: translateX(800px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sheen { animation: none !important; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="249" rx="4" fill="#0D0D0F" stroke="#2A2A2E"/>
  <rect x="0" y="0" width="900" height="2" rx="1" fill="#7D9D7F" fill-opacity="0.65"/>

  <g text-anchor="middle">
    <text x="60" y="74" font-family="'Optima','Palatino Linotype',Georgia,serif" font-size="34" fill="#EDEAE3">15</text>
    <text x="60" y="98" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#5C5C62">REPOSITORIES</text>
  </g>
  <rect x="160" y="46" width="1" height="60" fill="#2A2A2E"/>
  <g text-anchor="middle">
    <text x="260" y="74" font-family="'Optima','Palatino Linotype',Georgia,serif" font-size="34" fill="#EDEAE3">10</text>
    <text x="260" y="98" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#5C5C62">STARS EARNED</text>
  </g>
  <rect x="360" y="46" width="1" height="60" fill="#2A2A2E"/>
  <g text-anchor="middle">
    <text x="460" y="74" font-family="'Optima','Palatino Linotype',Georgia,serif" font-size="34" fill="#EDEAE3">5</text>
    <text x="460" y="98" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#5C5C62">FOLLOWERS</text>
  </g>
  <rect x="560" y="46" width="1" height="60" fill="#2A2A2E"/>
  <g text-anchor="middle">
    <text x="660" y="74" font-family="'Optima','Palatino Linotype',Georgia,serif" font-size="34" fill="#EDEAE3">18</text>
    <text x="660" y="98" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#5C5C62">LANGUAGES</text>
  </g>

  <text x="60" y="136" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#5C5C62">LANGUAGE MIX &#183; WEIGHTED BY REPOSITORY</text>

  <rect x="60" y="146" width="780" height="9" rx="4" fill="#16161A"/>
  <g>
    <rect x="60.0" y="146" width="305.6" height="9" fill="#3572A5"/>
    <rect x="365.6" y="146" width="170.9" height="9" fill="#89E051"/>
    <rect x="536.5" y="146" width="95.7" height="9" fill="#563D7C"/>
    <rect x="632.3" y="146" width="79.7" height="9" fill="#B07219"/>
    <rect x="711.9" y="146" width="68.3" height="9" fill="#B845FC"/>
    <rect x="780.3" y="146" width="59.7" height="9" fill="#222C37"/>
  </g>
  <g clip-path="url(#mixClip)">
    <rect class="sheen" opacity="0" x="60" y="146" width="160" height="9" fill="url(#sheen)"/>
  </g>

  <g>
    <circle cx="60" cy="186" r="4.5" fill="#3572A5"/>
    <text x="73" y="190" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">Python</text>
    <text x="300" y="190" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">34.9%</text>
  </g>
  <g>
    <circle cx="330" cy="186" r="4.5" fill="#89E051"/>
    <text x="343" y="190" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">Shell</text>
    <text x="570" y="190" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">19.5%</text>
  </g>
  <g>
    <circle cx="600" cy="186" r="4.5" fill="#563D7C"/>
    <text x="613" y="190" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">CSS</text>
    <text x="840" y="190" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">10.9%</text>
  </g>
  <g>
    <circle cx="60" cy="212" r="4.5" fill="#B07219"/>
    <text x="73" y="216" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">Java</text>
    <text x="300" y="216" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">9.1%</text>
  </g>
  <g>
    <circle cx="330" cy="212" r="4.5" fill="#B845FC"/>
    <text x="343" y="216" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">F#</text>
    <text x="570" y="216" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">7.8%</text>
  </g>
  <g>
    <circle cx="600" cy="212" r="4.5" fill="#222C37"/>
    <text x="613" y="216" font-family="ui-sans-serif,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9A9A9F">ShaderLab</text>
    <text x="840" y="216" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5C5C62">6.8%</text>
  </g>
</svg>
