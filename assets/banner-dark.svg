<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Talha Çağlar — Computer engineering student">
  <defs>
    <radialGradient id="glow" cx="250" cy="166" r="190" gradientUnits="userSpaceOnUse"><stop offset=".38" stop-color="#B9E769" stop-opacity=".55"/><stop offset=".6" stop-color="#B9E769" stop-opacity="0.17"/><stop offset="1" stop-color="#B9E769" stop-opacity="0"/></radialGradient>
    <clipPath id="typed"><rect class="type" x="444" y="226" width="508" height="26"/></clipPath>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .halo { animation: breathe 7s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
    .type { transform-box: fill-box; transform-origin: left center; animation: type 9s steps(47) infinite; }
    .caret { animation: caret 9s steps(47) infinite, blink 1.1s steps(1) infinite; }
    @keyframes type { 0% { transform: scaleX(0); } 45%,85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes caret { 0% { transform: translateX(-508px); } 45%,85% { transform: translateX(0); } 100% { transform: translateX(-508px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .halo, .type, .caret { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#151013"/>
    <!-- the glow from the profile photo: a dark shape with a lime rim, lights off -->
    <g class="halo">
      <circle cx="250" cy="166" r="190" fill="url(#glow)"/>
      <circle cx="250" cy="166" r="78" fill="none" stroke="#B9E769" stroke-width="14" opacity=".10"/>
      <circle cx="250" cy="166" r="78" fill="none" stroke="#B9E769" stroke-width="8" opacity=".18"/>
      <circle cx="250" cy="166" r="78" fill="none" stroke="#B9E769" stroke-width="3" opacity=".9"/>
    </g>
    <circle cx="250" cy="166" r="74" fill="#1A1116"/>
    <text x="250" y="174" text-anchor="middle" class="mono" font-size="22" fill="#B9E769" opacity=".85">~/clar</text>

    <text x="420" y="150" class="sans" font-size="50" font-weight="600" letter-spacing="-1" fill="#ECEAE4">Talha Çağlar</text>
    <text x="422" y="196" class="mono" font-size="20" fill="#A6A49C">computer engineering student</text>
    <text x="422" y="244" class="mono" font-size="18" fill="#B9E769">$</text>
    <text x="444" y="244" class="mono" font-size="18" fill="#6E6C66" clip-path="url(#typed)">curious since childhood, learning by building</text>
    <text x="952" y="244" class="mono caret" font-size="18" fill="#B9E769">▍</text>

    <text x="1168" y="296" text-anchor="end" class="mono" font-size="13" fill="#6E6C66" opacity=".7">lights off · glow on</text>
  </g>
</svg>
