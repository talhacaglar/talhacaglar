<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Talha Çağlar</title>
  <desc id="desc">Security engineering, Linux systems, and developer tooling.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C8A96A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3E3BE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F3E3BE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F3E3BE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#16171A"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="300" rx="10" fill="url(#vignette)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="10" fill="none" stroke="#C8A96A" stroke-opacity="0.22"/>

  <g font-family="'Optima', 'Palatino Linotype', 'Iowan Old Style', Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="640" y="128" font-size="58" font-weight="400" letter-spacing="14" fill="#F2EFE9">TALHA ÇAĞLAR</text>
  </g>

  <g>
    <rect x="360" y="158" width="560" height="1" fill="url(#rule)"/>
    <rect x="360" y="158" width="240" height="1" fill="url(#sheen)">
      <animate attributeName="x" values="330;680;330" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="640" cy="158.5" r="2.6" fill="#C8A96A"/>
  </g>

  <g font-family="ui-sans-serif, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#9A9A9F">
    <text x="640" y="199" font-size="14" letter-spacing="6">SECURITY ENGINEERING &#183; LINUX SYSTEMS &#183; DEVELOPER TOOLING</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#5E5E64">
    <text x="640" y="240" font-size="12" letter-spacing="3">@talhacaglar</text>
  </g>
</svg>
